
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Marcas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #F8F6F0;
            font-family: Arial, sans-serif;
        }

        /* RECTÁNGULO VERDE SUPERIOR */

        .franja-superior {
            width: 100%;
            height: 45px;

            background:
                radial-gradient(
                    ellipse at 20% 30%,
                    rgba(156, 205, 170, 0.18),
                    transparent 45%
                ),
                radial-gradient(
                    ellipse at 85% 65%,
                    rgba(180, 220, 190, 0.14),
                    transparent 40%
                ),
                linear-gradient(
                    115deg,
                    #062F25 0%,
                    #164C3A 50%,
                    #092D24 100%
                );

            border-bottom: 2px solid #D4B778;
        }

        /* MENÚ Y CONTENIDO */

        .estructura {
            display: flex;
            width: 100%;
            height: calc(100vh - 45px);
        }

        .menu-lateral {
            width: 19%;
            height: 100%;
            border: none;
            background: #062F25;
        }

        .contenido-principal {
            width: 81%;
            height: 100%;
            border: none;
            background: #FFFFFF;
        }

        @media (max-width: 700px) {
            .menu-lateral {
                width: 32%;
            }

            .contenido-principal {
                width: 68%;
            }
        }
    </style>
</head>

<body>

    <!-- RECTÁNGULO VERDE SIN TEXTO -->
    <div class="franja-superior"></div>

    <!-- MENÚ LATERAL Y CONTENIDO -->
    <div class="estructura">

        <iframe
            class="menu-lateral"
            src="menu.html"
            name="menu"
            title="Menú de categorías">
        </iframe>

        <iframe
            class="contenido-principal"
            src="inicio.html"
            name="contenido"
            title="Contenido del catálogo">
        </iframe>

    </div>

</body>
</html>
